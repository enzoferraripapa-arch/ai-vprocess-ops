name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python files
        run: python -m compileall -q prototype tools tests

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run public safety gate
        run: python tools/check_public_safety.py

      - name: Run demo
        run: python prototype/vprocess_graph.py --db .demo/vprocess_demo.db --input examples/sample_project_input.json

  quality:
    name: Ruff and Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run Bandit
        run: bandit -q -r prototype tools
